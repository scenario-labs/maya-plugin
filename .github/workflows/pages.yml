# GitHub Pages publish for https://maya.scenario.com: the handbook built from
# the docs (handbook.config.json) at the root, and the latest release's ZIP
# under /download/, by scenario-labs/plugin-site, the site tooling the Scenario
# plug-ins share. Runs after each release, on every push to main that changes
# the docs, and by hand. The handbook comes from the newest published release,
# so the site never describes a feature people cannot download yet.
# Pages serves it at https://scenario-labs.github.io/maya-plugin/; the Vercel
# project on tools/site_proxy holds maya.scenario.com and forwards every path
# there. RELEASING.md ("Site") lists what an administrator sets once.
name: Publish site

on:
  # workflow_run is safe here: the build checks out main, never the
  # triggering run's head_sha, uses none of its artifacts, keeps no
  # credentials, and runs only after a successful push run on main.
  workflow_run:
    workflows: [release-please]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "handbook.config.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only this repository publishes, and only after a release run that
    # succeeded on a push to main.
    if: >-
      github.repository == 'scenario-labs/maya-plugin' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The handbook from the newest release's docs, and its ZIP once the
      # release's SHA256SUMS and build attestation verify.
      - id: site
        uses: scenario-labs/plugin-site@1acb13a05820668eca37ce8f2e787432ad597457 # main, before v0.1.0
        with:
          download: scenario-maya-{version}.zip
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
