name: CI

# Checks that run without Maya. GitHub-hosted runners have no Maya install, so
# the mayapy and GUI tests run on a Mac with tools/test_maya.sh and
# tools/test_maya_gui.sh (see AGENTS.md).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: No em dashes, no secrets, JSON parses
        run: python3 tools/lint.py
      - name: Ruff
        run: |
          uvx ruff@0.17.1 check .
          uvx ruff@0.17.1 format --check .

  unit:
    name: unit (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.11", "3.13"]
        # One leg measures coverage (configured in pyproject.toml) for upload-coverage.
        include:
          - os: ubuntu-24.04
            python: "3.13"
            coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # The test tools and their pins are the test group in pyproject.toml.
      - name: Core unit tests against the fake Scenario server (0 CU)
        env:
          SCENARIO_MAYA_CREDSTORE: memory
        run: uv run --python ${{ matrix.python }} --only-group test ${{ matrix.coverage && 'coverage run -m' || '' }} pytest -q tests/unit
      - name: Coverage report
        if: matrix.coverage
        run: |
          uv run --python ${{ matrix.python }} --only-group test coverage xml -o "$RUNNER_TEMP/coverage/python.xml"
          uv run --python ${{ matrix.python }} --only-group test coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.coverage
        with:
          name: coverage-python
          path: ${{ runner.temp }}/coverage/python.xml
          if-no-files-found: error
          retention-days: 14

  # A job of its own so code-quality: write never reaches the test code. GitHub
  # compares a PR against the main branch's last upload. A fork PR's token
  # cannot write, so it skips. Not part of ci-ok: a failed upload is not a
  # failed test.
  upload-coverage:
    name: upload-coverage
    needs: unit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-python
          path: coverage
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage/python.xml
          language: Python
          label: code-coverage/python

  # The one check branch rules should require from this workflow, so jobs can
  # be added or renamed without touching the rules. Do not rename it.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A CI job did not succeed: $RESULTS"
              exit 1
            fi
          done
